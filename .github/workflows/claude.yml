name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as a senior Go engineer. Focus on:
            - Correctness bugs and unhandled errors
            - Concurrency and context misuse
            - Twirp and protobuf contract changes (renumbered fields, breaking renames)
            - Missing or weak tests for changed behaviour
            - Documentation that no longer matches the code

            Use `gh pr diff` and `gh pr view` to read the change. Post one
            review comment with `gh pr comment`, ordered by severity, with
            file and line references. Do not approve or request changes.
            Say plainly when there is nothing to report.

          claude_args: '--allowed-tools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh search:*)"'
